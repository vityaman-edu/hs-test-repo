name: Haskell CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Haskell (GHC and Stack)
        id: setup-haskell
        uses: haskell/actions/setup@v2
        with:
          stack-version: 'latest'

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('**/stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Build project
        run: stack build

      - name: Run Part 1 tests
        run: stack test --ta "-p Part1"

      - name: Run Part 2 tests
        run: stack test --ta "-p Part2"

      - name: Run Part 3 tests
        run: stack test --ta "-p Part3"

      - name: Run Part 4 tests
        run: stack test --ta "-p Part4"

      - name: Run Part 5 tests
        run: stack test --ta "-p Part5"

      - name: Run Part 6 tests
        run: stack test --ta "-p Part6"
